[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: errores y nombres no definidos · B: errores frecuentes · S: seguridad (bandit)
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
