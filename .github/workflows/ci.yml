name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pruebas, lint y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Incluye las reglas de seguridad de bandit (S)
      - run: ruff check .
      - run: pytest -q
      # Falla si alguna dependencia tiene vulnerabilidades conocidas
      - run: pip-audit -r requirements.txt

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t backpy_eval3 .
      # La imagen no debe ejecutarse como root
      - run: test "$(docker run --rm backpy_eval3 id -u)" != "0"
